[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idrd"
version = "0.1.0"
description = "CLI for IDRD Portal Ciudadano API (Bogotá recreation institute)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.4.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
idrd = "idrd.cli:app"
idrd-mcp = "idrd.mcp_server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
